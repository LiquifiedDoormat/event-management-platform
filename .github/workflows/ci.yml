name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: event_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d event_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway CI-only database inside the job container. Not a real credential.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/event_ci
      APP_URL: http://localhost:3000
      OTP_PROVIDER: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
